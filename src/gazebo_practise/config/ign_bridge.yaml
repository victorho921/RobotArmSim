- ros_topic_name: "force_torque"
  gz_topic_name: "force_torque"
  ros_type_name: "geometry_msgs/msg/WrenchStamped"
  gz_type_name: "ignition.msgs.Wrench"
  direction: GZ_TO_ROS

- ros_topic_name: "force_torque_joint6"
  gz_topic_name: "/world/empty/model/fr3/joint/fr3_joint6/sensor/force_torque_sensor/forcetorque"
  ros_type_name: "geometry_msgs/msg/WrenchStamped"
  gz_type_name: "ignition.msgs.Wrench"
  direction: GZ_TO_ROS

  # Camera image + camera_info for Gazebo Fortress
- topic_name: "camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
  lazy: true

- topic_name: "camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  lazy: true

# Optional but recommended
- topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
